# FlowTree 工作区配置示例。本机真实配置放在 .flowtree/workspaces.yaml (已被 gitignore), 或用环境变量
# FLOWTREE_WORKSPACES 指向其他路径。相对路径 (stories/mappings) 以 FlowTree 仓库根目录为基准。
#
# 页面只读: 打开/刷新/展开不会启动测试, 也不会修改被测项目; 它只读取证据, 并在 execution_context
# 描述的上下文里重新计算"证据是否仍适用"。execution_context 必须与当初执行时一致, 否则有效性会显示
# 待更新/未知 —— 这是预期行为, 不是缺陷。API 只暴露环境变量的名称, 不暴露值。
workspaces:
  - id: life-piggy-bank
    name: Life-Piggy-Bank
    project_root: /absolute/path/to/Life-Piggy-Bank
    python: /absolute/path/to/Life-Piggy-Bank/backend/venv/bin/python   # 被测项目自己的解释器
    stories: [examples/stories]
    mappings: [examples/mappings]
    execution_context:
      mode: pinned          # inherit (默认): 宿主环境 + 覆盖项, 与此前行为一致; pinned: 子进程只拿到下面声明的变量
      env:                  # 字面值, 非机密。疑似密钥/凭据 (含 URL 内嵌密码) 会被配置校验拒绝
        ENVIRONMENT: test
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        PYTHONDONTWRITEBYTECODE: "1"
      env_from_host: []     # 机密/凭据只写变量名, 值在运行/重检时从启动进程的宿主环境读取, 永不落盘; 缺失 → 执行 blocked / 重检 unknown
      # pinned_path: "/usr/bin:/bin"    # 仅 pinned, 可选; 默认 /usr/bin:/bin:/usr/sbin:/sbin
      git_excludes_file: /absolute/path/to/git-excludes   # 可选: git 排除规则 (pinned 下同时隔离宿主的系统/全局 git 配置)

  # Flutter 客户端测试 (runner: flutter) 的 pinned 上下文示例。映射 argv 只能是 `flutter test <相对的 *_test.dart>`;
  # 必须声明 HOME (否则 flutter 会把 .config/flutter、.flutter 写进工作目录, FlowTree 会明确阻塞); 不会自动 pub get、
  # 升级 SDK 或联网, 依赖缓存/SDK 缺失会阻塞。
  - id: life-piggy-bank-flutter
    name: Life-Piggy-Bank (flutter)
    project_root: /absolute/path/to/Life-Piggy-Bank
    stories: [examples/stories]
    mappings: [/absolute/path/to/flutter-mappings]
    execution_context:
      mode: pinned
      pinned_path: "/absolute/path/to/flutter/bin:/usr/bin:/bin"   # 让映射里的 `flutter` 解析到固定的 SDK
      env_from_host: [HOME]
      env: {PYTHONDONTWRITEBYTECODE: "1"}
      git_excludes_file: /absolute/path/to/git-excludes
