<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowTree 树网二象性状态电路中枢 (通用引擎中间层)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel for JSX -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes electricFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .flow-wire {
      stroke-dasharray: 8, 6;
      animation: electricFlow 1.2s linear infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
      50% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.8); }
    }
    .bulb-breathing { animation: pulseGlow 2s infinite ease-in-out; }
    @keyframes alertFlash {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
    }
    .bulb-alert { animation: alertFlash 1.5s infinite ease-in-out; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen overflow-hidden selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==========================================
    // 故事/模块旅程元数据字典 (E2E Storyboards & Lanes)
    // ==========================================
    const STORYBOARD_METADATA = {
      "STORY-1": {
        id: "STORY-1",
        name: "模块一：打工人小李的自律逆袭记",
        subtitle: "立Flag 晨跑打卡 ➔ 10个A币秒速到账 ➔ 买顿大餐犒赏自己 (个人A分闭环)",
        color: "#06b6d4",
        tag: "个人自律",
        icon: "🏃‍♂️",
        themeBg: "rgba(6, 182, 212, 0.08)",
        themeBorder: "rgba(6, 182, 212, 0.3)"
      },
      "STORY-2": {
        id: "STORY-2",
        name: "模块二：小情侣的甜宠互勉大作战",
        subtitle: "扫码绑定女友 ➔ 派发早睡任务 ➔ 拍照交作业 ➔ 女友审批发奖 ➔ 请喝奶茶核销 (伙伴B分闭环)",
        color: "#ec4899",
        tag: "情侣互勉",
        icon: "👫",
        themeBg: "rgba(236, 72, 153, 0.08)",
        themeBorder: "rgba(236, 72, 153, 0.3)"
      },
      "STORY-3": {
        id: "STORY-3",
        name: "模块三：月光族抵抗奶茶诱惑存钱",
        subtitle: "立2000元存钱梦想 ➔ 忍住不买随手记 ➔ 破功据实扣款警示 ➔ 存满买手机登记发票 (克制挑战)",
        color: "#eab308",
        tag: "克制存钱",
        icon: "🐷",
        themeBg: "rgba(234, 179, 8, 0.08)",
        themeBorder: "rgba(234, 179, 8, 0.3)"
      },
      "LANE-A": {
        id: "LANE-A",
        name: "航道一：个人自律践行闭环 (A分)",
        subtitle: "习惯打卡与个人分账",
        color: "#06b6d4",
        tag: "个人自律",
        icon: "🏃‍♂️",
        themeBg: "rgba(6, 182, 212, 0.08)",
        themeBorder: "rgba(6, 182, 212, 0.3)"
      },
      "LANE-B": {
        id: "LANE-B",
        name: "航道二：伙伴他律与商城闭环 (B分)",
        subtitle: "双人监督与商城兑换",
        color: "#a855f7",
        tag: "双人互勉",
        icon: "👫",
        themeBg: "rgba(168, 85, 247, 0.08)",
        themeBorder: "rgba(168, 85, 247, 0.3)"
      },
      "LANE-C": {
        id: "LANE-C",
        name: "航道三：冲动克制储蓄挑战闭环",
        subtitle: "心理学存钱罐挑战",
        color: "#84cc16",
        tag: "心理挑战",
        icon: "🐷",
        themeBg: "rgba(132, 204, 22, 0.08)",
        themeBorder: "rgba(132, 204, 22, 0.3)"
      },
      "LANE-INFRA": {
        id: "LANE-INFRA",
        name: "公共基座中心：鉴权/行级锁/测试门禁",
        subtitle: "基础服务与质量守护",
        color: "#38bdf8",
        tag: "底座测试",
        icon: "🛡️",
        themeBg: "rgba(56, 189, 248, 0.08)",
        themeBorder: "rgba(56, 189, 248, 0.3)"
      }
    };

    function getStoryMeta(laneId) {
      if (STORYBOARD_METADATA[laneId]) return STORYBOARD_METADATA[laneId];
      return {
        id: laneId,
        name: laneId ? `模块舱：${laneId}` : "核心业务主链路",
        subtitle: "端到端业务流转序列",
        color: "#10b981",
        tag: laneId || "业务流",
        icon: "📦",
        themeBg: "rgba(16, 185, 129, 0.08)",
        themeBorder: "rgba(16, 185, 129, 0.3)"
      };
    }

    // ==========================================
    // 自适应树网电路画布 (Tree + Circuit Canvas)
    // ==========================================
    function AdaptiveCircuitCanvas({
      nodes,
      edges,
      modules,
      onNodeSelect,
      selectedNodeId,
      assigneeFilter,
      riskOnlyFilter,
      focusNodeId,
      collapsedModules,
      onToggleModuleCollapse,
      highlightNodeIds
    }) {
      const containerRef = useRef(null);

      const [transform, setTransform] = useState({ x: 50, y: 40, scale: 0.95 });
      const transformRef = useRef(transform);
      transformRef.current = transform;

      const [isPanning, setIsPanning] = useState(false);
      const isPanningRef = useRef(false);
      const panStartRef = useRef({ x: 0, y: 0 });

      const [nodePositions, setNodePositions] = useState({});
      const nodePositionsRef = useRef(nodePositions);
      nodePositionsRef.current = nodePositions;

      const [laneBoxes, setLaneBoxes] = useState({});

      const draggingNodeRef = useRef(null);

      // 自适应多模块排布计算 (支持模块折叠)
      useEffect(() => {
        if (!nodes || nodes.length === 0) {
          setNodePositions({});
          setLaneBoxes({});
          return;
        }

        const laneMap = {};
        const laneOrder = [];

        nodes.forEach(n => {
          const lId = n.raw?.parentId || "MAIN";
          if (!laneMap[lId]) {
            laneMap[lId] = [];
            laneOrder.push(lId);
          }
          laneMap[lId].push(n);
        });

        const newPos = {};
        const newBoxes = {};

        const cardWidth = 270;
        const cardHeight = 125;
        const gapX = 75;
        const gapY = 55;
        const maxCols = 4;

        let currentY = 80;

        laneOrder.forEach((lId) => {
          const lNodes = laneMap[lId];
          const startX = 60;
          const trackStartY = currentY;
          const isCollapsed = collapsedModules.has(lId);

          if (isCollapsed) {
            // 模块折叠状态：缩减为一个高度仅 70px 的紧凑胶囊卡片
            newBoxes[lId] = {
              x: startX - 25,
              y: trackStartY - 45,
              width: 720,
              height: 75,
              nodeCount: lNodes.length,
              isCollapsed: true
            };
            currentY += 105;
          } else {
            // 模块展开状态：完整显示内部节点与连线
            const numNodes = lNodes.length;
            const totalRows = Math.ceil(numNodes / maxCols);
            const colsInFirstRow = Math.min(numNodes, maxCols);

            const trackWidth = Math.max(480, colsInFirstRow * cardWidth + (colsInFirstRow - 1) * gapX + 60);
            const trackHeight = totalRows * cardHeight + (totalRows - 1) * gapY + 70;

            newBoxes[lId] = {
              x: startX - 25,
              y: trackStartY - 45,
              width: trackWidth,
              height: trackHeight,
              nodeCount: numNodes,
              isCollapsed: false
            };

            lNodes.forEach((node, idx) => {
              const row = Math.floor(idx / maxCols);
              const col = idx % maxCols;

              const posX = startX + col * (cardWidth + gapX);
              const posY = trackStartY + row * (cardHeight + gapY);

              newPos[node.id] = {
                x: posX,
                y: posY,
                width: cardWidth,
                height: cardHeight,
                row,
                col,
                laneId: lId
              };
            });

            currentY += trackHeight + 60;
          }
        });

        setNodePositions(newPos);
        setLaneBoxes(newBoxes);
      }, [nodes, collapsedModules]);

      // 聚焦节点平移 (自动预留右侧 460px 抽屉空间)
      const focusOnNode = useCallback((nodeId) => {
        const targetPos = nodePositionsRef.current[nodeId];
        const container = containerRef.current;
        if (!targetPos || !container) return;

        const rect = container.getBoundingClientRect();
        const availableWidth = rect.width - 460;
        const availableHeight = rect.height;
        const scale = transformRef.current.scale;

        const nodeCenterX = targetPos.x + targetPos.width / 2;
        const nodeCenterY = targetPos.y + targetPos.height / 2;

        const targetX = availableWidth / 2 - nodeCenterX * scale;
        const targetY = availableHeight / 2 - nodeCenterY * scale;

        setTransform({ x: targetX, y: targetY, scale });
      }, []);

      useEffect(() => {
        if (focusNodeId) {
          focusOnNode(focusNodeId);
        }
      }, [focusNodeId, focusOnNode]);

      // 全局鼠标拖拽与漫游
      useEffect(() => {
        const handleGlobalMouseMove = (e) => {
          if (isPanningRef.current) {
            setTransform(prev => ({
              ...prev,
              x: e.clientX - panStartRef.current.x,
              y: e.clientY - panStartRef.current.y
            }));
            return;
          }

          if (draggingNodeRef.current) {
            const { nodeId, startMouseX, startMouseY, startNodeX, startNodeY } = draggingNodeRef.current;
            const currentScale = transformRef.current.scale;
            const dx = (e.clientX - startMouseX) / currentScale;
            const dy = (e.clientY - startMouseY) / currentScale;
            setNodePositions(prev => ({
              ...prev,
              [nodeId]: {
                ...prev[nodeId],
                x: startNodeX + dx,
                y: startNodeY + dy
              }
            }));
          }
        };

        const handleGlobalMouseUp = () => {
          if (isPanningRef.current) {
            isPanningRef.current = false;
            setIsPanning(false);
          }
          if (draggingNodeRef.current) {
            draggingNodeRef.current = null;
          }
        };

        window.addEventListener('mousemove', handleGlobalMouseMove);
        window.addEventListener('mouseup', handleGlobalMouseUp);

        return () => {
          window.removeEventListener('mousemove', handleGlobalMouseMove);
          window.removeEventListener('mouseup', handleGlobalMouseUp);
        };
      }, []);

      const handleWheel = (e) => {
        e.preventDefault();
        const container = containerRef.current;
        if (!container) return;

        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        setTransform(prev => {
          const nextScale = Math.min(Math.max(prev.scale * zoomFactor, 0.2), 3.0);
          const nextX = mouseX - (mouseX - prev.x) * (nextScale / prev.scale);
          const nextY = mouseY - (mouseY - prev.y) * (nextScale / prev.scale);
          return { x: nextX, y: nextY, scale: nextScale };
        });
      };

      const handleCanvasMouseDown = () => {
        isPanningRef.current = true;
        setIsPanning(true);
        panStartRef.current = {
          x: window.event.clientX - transformRef.current.x,
          y: window.event.clientY - transformRef.current.y
        };
      };

      const handleNodeMouseDown = (e, nodeId) => {
        e.stopPropagation();
        const currentPos = nodePositionsRef.current[nodeId] || { x: 0, y: 0 };
        draggingNodeRef.current = {
          nodeId,
          startMouseX: e.clientX,
          startMouseY: e.clientY,
          startNodeX: currentPos.x,
          startNodeY: currentPos.y
        };
      };

      const zoomIn = () => setTransform(prev => ({ ...prev, scale: Math.min(prev.scale * 1.2, 3.0) }));
      const zoomOut = () => setTransform(prev => ({ ...prev, scale: Math.max(prev.scale * 0.8, 0.2) }));
      const resetView = () => setTransform({ x: 50, y: 40, scale: 0.95 });

      return (
        <div
          ref={containerRef}
          onWheel={handleWheel}
          onMouseDown={handleCanvasMouseDown}
          className={`relative w-full h-full select-none overflow-hidden bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] ${
            isPanning ? 'cursor-grabbing' : 'cursor-grab'
          }`}
        >
          {/* 画布控制条 */}
          <div className="absolute bottom-6 left-6 z-20 flex items-center gap-1.5 bg-slate-900/90 border border-slate-700/80 rounded-xl p-1.5 shadow-2xl backdrop-blur-md">
            <button onClick={zoomIn} title="放大" className="w-8 h-8 rounded-lg hover:bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white font-mono text-base font-bold">＋</button>
            <button onClick={zoomOut} title="缩小" className="w-8 h-8 rounded-lg hover:bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white font-mono text-base font-bold">－</button>
            <button onClick={resetView} title="居中还原" className="px-2.5 h-8 rounded-lg hover:bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white text-xs font-mono">⟲ 适应</button>
            <span className="text-[11px] font-mono text-slate-400 px-2 border-l border-slate-800">
              {Math.round(transform.scale * 100)}%
            </span>
          </div>

          {/* 转换平移容器 */}
          <div
            style={{
              transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`,
              transformOrigin: '0 0',
              position: 'absolute',
              inset: 0,
              pointerEvents: 'none'
            }}
          >
            {/* 模块级边界卡片与责任人列表 */}
            {Object.keys(laneBoxes).map(lId => {
              const meta = getStoryMeta(lId);
              const box = laneBoxes[lId];
              if (!box) return null;

              const modSummary = modules?.find(m => m.moduleId === lId);
              const isCollapsed = box.isCollapsed;

              return (
                <div key={lId}>
                  {/* 模块半透明外框 */}
                  <div
                    style={{
                      position: "absolute",
                      left: `${box.x}px`,
                      top: `${box.y}px`,
                      width: `${box.width}px`,
                      height: `${box.height}px`,
                      pointerEvents: "none",
                      backgroundColor: meta.themeBg,
                      borderColor: meta.themeBorder
                    }}
                    className="rounded-2xl border backdrop-blur-sm -z-10 transition-all duration-300 shadow-lg"
                  />

                  {/* 模块头部信息与折叠控制 */}
                  <div
                    style={{
                      position: "absolute",
                      left: `${box.x + 20}px`,
                      top: `${box.y + 14}px`,
                      pointerEvents: "auto"
                    }}
                    className="flex items-center gap-3 z-10"
                  >
                    <button
                      onClick={() => onToggleModuleCollapse(lId)}
                      className="px-2 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-[11px] font-mono border border-slate-700 cursor-pointer shadow-sm"
                      title={isCollapsed ? "点击展开模块内部任务" : "点击折叠模块"}
                    >
                      {isCollapsed ? "+ 展开" : "- 折叠"}
                    </button>

                    <span className="text-base">{meta.icon}</span>
                    <h3 className="font-bold text-sm tracking-wide text-slate-100 font-sans">
                      {meta.name}
                    </h3>

                    {/* 模块负责人列表 (第一类公民展现) */}
                    {modSummary?.assignees && modSummary.assignees.length > 0 && (
                      <div className="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-900/90 border border-slate-700 text-[11px] text-slate-300">
                        <span className="text-slate-400">👥 负责人:</span>
                        <span className="font-medium text-emerald-400">
                          {modSummary.assignees.join(", ")}
                        </span>
                      </div>
                    )}

                    <span className="text-[10px] px-2 py-0.5 rounded font-mono bg-slate-900/90 text-slate-300 border border-slate-700">
                      {box.nodeCount} 项任务
                    </span>

                    {modSummary && (
                      <span className="text-[11px] font-mono text-emerald-400 font-bold">
                        {Math.round(modSummary.progressRate * 100)}% 导通
                      </span>
                    )}
                  </div>
                </div>
              );
            })}

            {/* SVG 导线层 (折叠模块不显示连线) */}
            <svg
              className="absolute pointer-events-none overflow-visible"
              style={{ width: '1px', height: '1px', left: 0, top: 0 }}
            >
              <defs>
                <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="4" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              {edges.map(e => {
                const sPos = nodePositions[e.source];
                const tPos = nodePositions[e.target];
                if (!sPos || !tPos) return null;

                const isSameRow = Math.abs(sPos.y - tPos.y) < 25;
                let d = "";

                if (isSameRow) {
                  const startX = sPos.x + (sPos.width || 270);
                  const startY = sPos.y + (sPos.height || 125) / 2;
                  const endX = tPos.x;
                  const endY = tPos.y + (tPos.height || 125) / 2;
                  const deltaX = Math.max(25, (endX - startX) / 2);
                  d = `M ${startX} ${startY} C ${startX + deltaX} ${startY}, ${endX - deltaX} ${endY}, ${endX} ${endY}`;
                } else {
                  const startX = sPos.x + (sPos.width || 270) / 2;
                  const startY = sPos.y + (sPos.height || 125);
                  const endX = tPos.x + (tPos.width || 270) / 2;
                  const endY = tPos.y;
                  const midY = (startY + endY) / 2;
                  d = `M ${startX} ${startY} C ${startX + midY}, ${endX} ${midY}, ${endX} ${endY}`;
                }

                const isEnergized = e.circuitState === "energized";
                const isBlocked = e.circuitState === "blocked";

                const sNode = nodes.find(n => n.id === e.source);
                const tNode = nodes.find(n => n.id === e.target);

                let edgeOpacity = 1.0;
                if (highlightNodeIds && highlightNodeIds.length > 0) {
                  const isInHighlight = highlightNodeIds.includes(e.source) && highlightNodeIds.includes(e.target);
                  edgeOpacity = isInHighlight ? 1.0 : 0.1;
                } else if (assigneeFilter !== "all") {
                  const sMatch = sNode?.raw?.assignee?.includes(assigneeFilter);
                  const tMatch = tNode?.raw?.assignee?.includes(assigneeFilter);
                  if (!sMatch && !tMatch) edgeOpacity = 0.15;
                }

                let strokeColor = "#334155";
                let strokeWidth = 2.5;
                let strokeFilter = "";

                if (isBlocked) {
                  strokeColor = "#ef4444";
                  strokeWidth = 3;
                  strokeFilter = "url(#glowRed)";
                } else if (isEnergized) {
                  strokeColor = "#10b981";
                  strokeWidth = 3;
                  strokeFilter = "url(#glowGreen)";
                }

                return (
                  <g key={e.id} opacity={edgeOpacity}>
                    <path
                      d={d}
                      fill="none"
                      stroke={strokeColor}
                      strokeWidth={strokeWidth}
                      filter={strokeFilter}
                      className={isEnergized ? "flow-wire" : ""}
                    />
                    {isEnergized && (
                      <path
                        d={d}
                        fill="none"
                        stroke="#a7f3d0"
                        strokeWidth={1.5}
                        strokeDasharray="4, 16"
                        className="flow-wire"
                      />
                    )}
                  </g>
                );
              })}
            </svg>

            {/* 任务节点卡片 (折叠模块下的节点隐藏) */}
            {nodes.map(node => {
              const pos = nodePositions[node.id];
              if (!pos) return null; // 被折叠的模块节点 pos 为空

              const isSelected = selectedNodeId === node.id;
              const bulb = node.bulbState;
              const isProxySlot = node.raw?.tags?.includes("proxy");

              let nodeOpacity = 1.0;
              let isFocus = true;

              if (highlightNodeIds && highlightNodeIds.length > 0) {
                if (!highlightNodeIds.includes(node.id)) {
                  nodeOpacity = 0.2;
                  isFocus = false;
                }
              } else if (assigneeFilter !== "all" && !isProxySlot) {
                const match = node.raw?.assignee?.includes(assigneeFilter);
                if (!match) {
                  nodeOpacity = 0.25;
                  isFocus = false;
                }
              }

              if (riskOnlyFilter && node.status === "review_pass" && !isProxySlot) {
                nodeOpacity = 0.15;
              }

              let bulbBg = "bg-slate-700 text-slate-400";
              let cardBorder = "border-slate-800 bg-slate-900/95";
              let bulbGlowClass = "";
              let statusLabel = "待启动";

              if (isProxySlot) {
                bulbBg = "bg-sky-400 shadow-[0_0_12px_#38bdf8]";
                cardBorder = "border-sky-500/40 bg-sky-950/20";
                statusLabel = "通用基座 (已就绪)";
              } else if (bulb === "green_on") {
                bulbBg = "bg-emerald-500 text-white shadow-[0_0_15px_#10b981]";
                cardBorder = "border-emerald-500/60 bg-emerald-950/30";
                statusLabel = "端验收通过";
              } else if (bulb === "blue_waiting") {
                bulbBg = "bg-sky-500 text-white shadow-[0_0_15px_#0ea5e9]";
                cardBorder = "border-sky-500/60 bg-sky-950/30";
                statusLabel = "待人工终审";
              } else if (bulb === "breathing") {
                bulbBg = "bg-amber-500 text-white";
                cardBorder = "border-amber-500/60 bg-amber-950/30";
                bulbGlowClass = "bulb-breathing";
                statusLabel = "体验走查中";
              } else if (bulb === "red_alert") {
                bulbBg = "bg-rose-600 text-white";
                cardBorder = "border-rose-600/80 bg-rose-950/40";
                bulbGlowClass = "bulb-alert";
                statusLabel = "缺陷阻断";
              }

              const desc = node.raw?.description || "";
              const cleanDesc = desc.replace("【用户视点】", "").trim();

              return (
                <div
                  key={node.id}
                  onMouseDown={(e) => handleNodeMouseDown(e, node.id)}
                  onClick={(e) => {
                    e.stopPropagation();
                    onNodeSelect(node.raw);
                    focusOnNode(node.id);
                  }}
                  style={{
                    position: "absolute",
                    left: `${pos.x}px`,
                    top: `${pos.y}px`,
                    width: `${pos.width}px`,
                    height: `${pos.height}px`,
                    opacity: nodeOpacity,
                    pointerEvents: 'auto'
                  }}
                  className={`group cursor-move rounded-xl border-2 p-3 transition-all duration-200 backdrop-blur-md shadow-xl flex flex-col justify-between ${cardBorder} ${
                    isSelected ? "ring-2 ring-emerald-400 scale-[1.03] z-10" : isFocus ? "hover:border-slate-500 hover:scale-[1.01]" : ""
                  }`}
                >
                  <div className="flex items-start justify-between gap-1.5">
                    <div className="flex items-center gap-2 overflow-hidden flex-1">
                      <div className={`w-3.5 h-3.5 rounded-full shrink-0 ${bulbBg} ${bulbGlowClass}`} />
                      <span className="font-bold text-xs truncate text-slate-100 group-hover:text-emerald-300">
                        {node.label}
                      </span>
                    </div>
                    <span className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 shrink-0">
                      {node.id}
                    </span>
                  </div>

                  <p className="text-[11px] text-slate-400 line-clamp-1 leading-snug">
                    {cleanDesc || "端到端交互走查节点"}
                  </p>

                  <div className="text-[10px] font-mono text-slate-400 flex items-center justify-between">
                    <span className={isProxySlot ? "text-sky-300 font-bold" : bulb === "green_on" ? "text-emerald-400 font-medium" : bulb === "blue_waiting" ? "text-sky-400 font-medium" : ""}>
                      {statusLabel}
                    </span>
                    <span className="text-slate-500">{node.dataOverlay.hours}</span>
                  </div>

                  <div className="flex items-center justify-between text-[11px] pt-1.5 border-t border-slate-800/80">
                    <div className="flex items-center gap-1.5 text-slate-400">
                      <span className="w-4 h-4 rounded-full bg-slate-800 flex items-center justify-center text-[9px] text-slate-300 font-bold">
                        {node.dataOverlay.assignee ? node.dataOverlay.assignee[0] : "?"}
                      </span>
                      <span className="truncate max-w-[110px] text-[10px] font-medium text-slate-300">
                        {node.dataOverlay.assignee || "未分配"}
                      </span>
                    </div>

                    <div className="flex items-center gap-1">
                      {node.dataOverlay.hasExternalBinding && (
                        <span className="px-1.5 py-0.2 rounded text-[9px] bg-indigo-950/90 text-indigo-300 border border-indigo-700/60 font-mono">
                          ⚡ 契约
                        </span>
                      )}
                      {node.dataOverlay.isLogicVerified && (
                        <span className="text-sky-400 text-xs font-bold" title="客观断言已通过">✓</span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 平台层主应用 App (通用引擎控制中枢)
    // ==========================================
    function App() {
      const [projectList, setProjectList] = useState([]);
      const [currentProjectId, setCurrentProjectId] = useState("proj-life-piggy-bank");
      const [projectMeta, setProjectMeta] = useState(null);
      const [canvasData, setCanvasData] = useState(null);
      const [activeViewId, setActiveViewId] = useState("view-all");
      const [selectedNode, setSelectedNode] = useState(null);
      const [focusNodeId, setFocusNodeId] = useState(null);
      const [loading, setLoading] = useState(true);

      const [assigneeFilter, setAssigneeFilter] = useState("all");
      const [riskOnlyFilter, setRiskOnlyFilter] = useState(false);
      const [isSimulating, setIsSimulating] = useState(false);

      // 模块折叠状态集合
      const [collapsedModules, setCollapsedModules] = useState(new Set());
      // 卡点归属面板开关
      const [bottlenecksModalOpen, setBottlenecksModalOpen] = useState(false);

      const toggleModuleCollapse = (moduleId) => {
        setCollapsedModules(prev => {
          const next = new Set(prev);
          if (next.has(moduleId)) next.delete(moduleId);
          else next.add(moduleId);
          return next;
        });
      };

      // 提取全部可用参与人员列表
      const allAssignees = useMemo(() => {
        if (!canvasData?.personalSupplyChains) return [];
        return Object.keys(canvasData.personalSupplyChains);
      }, [canvasData]);

      // 当前被聚焦人员的上下游链路
      const currentSupplyChain = useMemo(() => {
        if (assigneeFilter === "all" || !canvasData?.personalSupplyChains) return null;
        return canvasData.personalSupplyChains[assigneeFilter] || null;
      }, [assigneeFilter, canvasData]);

      // 当前供应链相关的所有高亮节点
      const highlightNodeIds = useMemo(() => {
        if (!currentSupplyChain) return null;
        const ids = [...currentSupplyChain.myNodes];
        currentSupplyChain.upstreamFeeders.forEach(u => ids.push(u.nodeId));
        currentSupplyChain.downstreamWaiters.forEach(d => ids.push(d.nodeId));
        return ids;
      }, [currentSupplyChain]);

      useEffect(() => {
        fetch("/api/projects")
          .then(res => res.json())
          .then(data => setProjectList(data))
          .catch(err => console.error("加载项目列表失败:", err));
      }, []);

      const fetchProjectData = async (projId, viewId) => {
        try {
          const [metaRes, canvasRes] = await Promise.all([
            fetch(`/api/projects/${projId}`),
            fetch(`/api/projects/${projId}/canvas?view_id=${viewId}`)
          ]);
          const meta = await metaRes.json();
          const canvas = await canvasRes.json();
          setProjectMeta(meta);
          setCanvasData(canvas);
          if (selectedNode) {
            const updated = canvas.nodes.find(n => n.id === selectedNode.nodeId);
            if (updated) setSelectedNode(updated.raw);
          }
        } catch (err) {
          console.error("加载数据失败:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchProjectData(currentProjectId, activeViewId);
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/circuit`);
        ws.onmessage = () => {
          fetchProjectData(currentProjectId, activeViewId);
        };
        return () => ws.close();
      }, [currentProjectId, activeViewId]);

      const handleProjectChange = (e) => {
        const nextId = e.target.value;
        setCurrentProjectId(nextId);
        setActiveViewId("view-all");
        setSelectedNode(null);
        setAssigneeFilter("all");
        setCollapsedModules(new Set());
        setLoading(true);
        fetchProjectData(nextId, "view-all");
      };

      const handleViewChange = (vId) => {
        setActiveViewId(vId);
        fetchProjectData(currentProjectId, vId);
      };

      const handleSimulateAgent = async () => {
        setIsSimulating(true);
        try {
          await fetch(`/api/projects/${currentProjectId}/simulate/run-agent-tests`, {
            method: "POST"
          });
          await fetchProjectData(currentProjectId, activeViewId);
        } catch (err) {
          console.error("Agent 模拟执行失败:", err);
        } finally {
          setIsSimulating(false);
        }
      };

      const handleHumanSignOff = async (nodeId) => {
        await fetch(`/api/projects/${currentProjectId}/nodes/${nodeId}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            status: "review_pass",
            reviewComments: ["【真机走查验收】端到端交互符合预期，确认签字通电！"],
            source: "human_reviewer"
          })
        });
        await fetchProjectData(currentProjectId, activeViewId);
      };

      const handleLocateNode = (nodeId) => {
        setFocusNodeId(nodeId);
        const target = canvasData?.nodes.find(n => n.id === nodeId);
        if (target) setSelectedNode(target.raw);
        setBottlenecksModalOpen(false);
      };

      if (loading) {
        return (
          <div className="h-screen flex items-center justify-center bg-slate-950 text-emerald-400 font-mono text-lg">
            ⚡ 正在规划树网二象性状态电路中枢...
          </div>
        );
      }

      const stats = canvasData?.stats || { totalNodes: 0, energizedNodes: 0, bottlenecks: [], modules: [] };
      const bottlenecks = stats.bottlenecks || [];

      return (
        <div className="flex flex-col h-screen bg-slate-950">
          {/* 顶栏 Header */}
          <header className="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/95 backdrop-blur-md shrink-0 z-20">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-[0_0_12px_rgba(16,185,129,0.3)]">
                ⚡
              </div>
              <div className="flex items-center gap-2">
                <select
                  value={currentProjectId}
                  onChange={handleProjectChange}
                  className="bg-slate-800 border border-slate-700 text-white font-bold text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
                >
                  {projectList.map(p => (
                    <option key={p.projectId} value={p.projectId}>
                      {p.projectName}
                    </option>
                  ))}
                </select>
                <span className="text-[11px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-mono">
                  {projectMeta?.version}
                </span>
                <span className="text-[11px] px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800 font-mono">
                  {projectMeta?.stage || "验收中"}
                </span>
              </div>
            </div>

            {/* 顶栏中心：模块组织大盘与卡点报警 */}
            <div className="flex items-center gap-3">
              {/* 卡点归属报警徽章 (第一类公民) */}
              <button
                onClick={() => setBottlenecksModalOpen(true)}
                className={`flex items-center gap-1.5 px-3 py-1 rounded-lg border text-xs font-mono transition-all cursor-pointer shadow-sm ${
                  bottlenecks.length > 0
                    ? "bg-rose-950/60 border-rose-700/80 text-rose-300 hover:bg-rose-900/80 bulb-alert"
                    : "bg-emerald-950/50 border-emerald-800 text-emerald-400"
                }`}
              >
                <span>{bottlenecks.length > 0 ? "🚨" : "🛡️"}</span>
                <span>
                  {bottlenecks.length > 0
                    ? `${bottlenecks.length} 处阻塞卡点 (看卡在谁那里)`
                    : "链路畅通·无阻塞"}
                </span>
              </button>

              {/* 模块级通电微缩条 */}
              {stats.modules?.map(m => {
                const meta = getStoryMeta(m.moduleId);
                const pct = Math.round(m.progressRate * 100);
                return (
                  <div
                    key={m.moduleId}
                    className="flex items-center gap-2 px-3 py-1 rounded-lg bg-slate-950 border border-slate-800 text-xs font-mono shadow-sm"
                  >
                    <span>{meta.icon}</span>
                    <span className="text-slate-400 font-sans">{meta.tag}</span>
                    <div className="w-12 h-1.5 rounded-full bg-slate-800 overflow-hidden">
                      <div className="h-full bg-emerald-400 rounded-full" style={{ width: `${pct}%` }} />
                    </div>
                    <span className="font-bold text-emerald-400">{pct}%</span>
                  </div>
                );
              })}
            </div>

            {/* 操作按钮 */}
            <div className="flex items-center gap-2">
              <button
                onClick={handleSimulateAgent}
                disabled={isSimulating}
                className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs flex items-center gap-1.5 shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all active:scale-95"
              >
                <span>⚡</span>
                <span>{isSimulating ? "Agent 校验中..." : "触发 Agent 状态联动"}</span>
              </button>
            </div>
          </header>

          {/* 第二栏：业务透镜 + 责任人聚焦与风险过滤 */}
          <div className="h-12 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/60 shrink-0 z-20">
            {/* 左侧：动态视角透镜 */}
            <div className="flex items-center gap-1.5 overflow-x-auto custom-scroll">
              <span className="text-xs text-slate-500 mr-1 font-mono shrink-0">视角透镜:</span>
              {projectMeta?.perspectives.map((p) => {
                const isActive = activeViewId === p.viewId;
                return (
                  <button
                    key={p.viewId}
                    onClick={() => handleViewChange(p.viewId)}
                    className={`px-3 py-1 rounded-md text-xs font-medium transition-all flex items-center gap-1 shrink-0 ${
                      isActive
                        ? "bg-slate-800 text-emerald-400 border border-emerald-500/40 shadow-sm"
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"
                    }`}
                  >
                    <span>{p.name}</span>
                  </button>
                );
              })}
            </div>

            {/* 右侧：责任人聚焦与风险过滤 */}
            <div className="flex items-center gap-4 shrink-0">
              <div className="flex items-center gap-1.5 text-xs">
                <span className="text-slate-500 font-mono">工位视角:</span>
                <select
                  value={assigneeFilter}
                  onChange={(e) => setAssigneeFilter(e.target.value)}
                  className="bg-slate-800 border border-slate-700 text-slate-200 rounded px-2.5 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer font-medium"
                >
                  <option value="all">🌐 全体成员 (全景模式)</option>
                  {allAssignees.map(a => (
                    <option key={a} value={a}>
                      👤 {a} 的专属工位
                    </option>
                  ))}
                </select>
              </div>

              <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer select-none hover:text-white">
                <input
                  type="checkbox"
                  checked={riskOnlyFilter}
                  onChange={(e) => setRiskOnlyFilter(e.target.checked)}
                  className="rounded bg-slate-800 border-slate-700 text-emerald-500 focus:ring-0 cursor-pointer"
                />
                <span className="font-mono text-amber-400">只看卡点与待审</span>
              </label>
            </div>
          </div>

          {/* 第三栏：个人工位供应链上下文条 (当选中具体人员时浮现) */}
          {currentSupplyChain && (
            <div className="h-10 border-b border-indigo-900/60 bg-indigo-950/40 px-6 flex items-center justify-between text-xs font-mono shrink-0 z-20 animate-in slide-in-from-top-2">
              <div className="flex items-center gap-3">
                <span className="font-bold text-indigo-300 flex items-center gap-1">
                  <span>🎯</span>
                  <span>【{assigneeFilter}】在全局链路中的工位:</span>
                </span>

                {/* 上游谁卡我 */}
                <div className="flex items-center gap-1.5 text-slate-300">
                  <span className="text-slate-500">⬅️ 上游输入 (我等谁):</span>
                  {currentSupplyChain.upstreamFeeders.length === 0 ? (
                    <span className="text-emerald-400">无需等待 (可独立开工)</span>
                  ) : (
                    currentSupplyChain.upstreamFeeders.map((u, i) => (
                      <span
                        key={i}
                        onClick={() => handleLocateNode(u.nodeId)}
                        className={`px-1.5 py-0.5 rounded text-[10px] cursor-pointer border ${
                          u.isReady
                            ? "bg-emerald-950 text-emerald-300 border-emerald-800"
                            : "bg-amber-950 text-amber-300 border-amber-800"
                        }`}
                        title={`等待 ${u.assignee} 的 ${u.label} (${u.status})`}
                      >
                        {u.assignee}: {u.nodeId} {u.isReady ? "✓" : "⏳"}
                      </span>
                    ))
                  )}
                </div>

                {/* 我的在手任务 */}
                <div className="flex items-center gap-1.5 text-slate-300 pl-3 border-l border-indigo-900">
                  <span className="text-slate-500">⭐ 在手任务:</span>
                  <span className="text-sky-300 font-bold">{currentSupplyChain.myNodes.length} 项</span>
                </div>

                {/* 下游谁等我 */}
                <div className="flex items-center gap-1.5 text-slate-300 pl-3 border-l border-indigo-900">
                  <span className="text-slate-500">➡️ 下游交付 (谁等我):</span>
                  {currentSupplyChain.downstreamWaiters.length === 0 ? (
                    <span className="text-slate-400">末端交付 (无下游阻塞)</span>
                  ) : (
                    currentSupplyChain.downstreamWaiters.map((d, i) => (
                      <span
                        key={i}
                        onClick={() => handleLocateNode(d.nodeId)}
                        className={`px-1.5 py-0.5 rounded text-[10px] cursor-pointer border ${
                          d.isBlocked
                            ? "bg-rose-950 text-rose-300 border-rose-800"
                            : "bg-slate-800 text-slate-300 border-slate-700"
                        }`}
                        title={`等待我放电给 ${d.assignee} 的 ${d.label}`}
                      >
                        {d.assignee}: {d.nodeId} {d.isBlocked ? "🚨等待我" : "✓"}
                      </span>
                    ))
                  )}
                </div>
              </div>

              <button
                onClick={() => setAssigneeFilter("all")}
                className="text-slate-400 hover:text-white text-xs underline"
              >
                退出工位视点
              </button>
            </div>
          )}

          {/* 主工作区 */}
          <div className="flex-1 relative overflow-hidden flex z-10">
            <div className="flex-1 h-full">
              <AdaptiveCircuitCanvas
                nodes={canvasData?.nodes || []}
                edges={canvasData?.edges || []}
                modules={stats.modules || []}
                selectedNodeId={selectedNode?.nodeId}
                onNodeSelect={(raw) => setSelectedNode(raw)}
                assigneeFilter={assigneeFilter}
                riskOnlyFilter={riskOnlyFilter}
                focusNodeId={focusNodeId}
                collapsedModules={collapsedModules}
                onToggleModuleCollapse={toggleModuleCollapse}
                highlightNodeIds={highlightNodeIds}
              />
            </div>

            {/* 右侧端测试验收抽屉 */}
            {selectedNode && (
              <div className="w-[460px] border-l border-slate-700/80 bg-slate-900 h-full flex flex-col shadow-2xl z-30 animate-in slide-in-from-right duration-150">
                <div className="p-5 border-b border-slate-800 bg-slate-950/60 flex items-start justify-between">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-emerald-400 uppercase font-bold border border-slate-700">
                        {selectedNode.nodeId}
                      </span>
                      <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300 uppercase">
                        {selectedNode.nodeType}
                      </span>
                    </div>
                    <h2 className="font-bold text-base text-white mt-2 leading-snug">{selectedNode.name}</h2>
                    <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{selectedNode.description || "无详细描述"}</p>
                  </div>
                  <button
                    onClick={() => setSelectedNode(null)}
                    className="text-slate-400 hover:text-white text-lg font-mono p-1 rounded hover:bg-slate-800 transition-colors"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-4 text-xs custom-scroll bg-slate-900">
                  {/* 流转状态卡 */}
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2.5">
                    <div className="flex justify-between items-center">
                      <span className="text-slate-400">端走查状态:</span>
                      <span className="font-mono font-bold text-emerald-400 px-2 py-0.5 rounded bg-emerald-950 border border-emerald-800">
                        {selectedNode.status}
                      </span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">责任人 / 角色:</span>
                      <span className="text-slate-200 font-medium">{selectedNode.assignee || "未指定"} ({selectedNode.assignRole || "-"})</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">预估/消耗工时:</span>
                      <span className="text-slate-200 font-mono">{selectedNode.actualHours}h / {selectedNode.estimateHours}h</span>
                    </div>
                  </div>

                  {/* 自动化测试契约 */}
                  {selectedNode.externalBinding && (
                    <div className="bg-indigo-950/30 p-4 rounded-xl border border-indigo-900/60 space-y-2">
                      <div className="font-semibold text-indigo-300 flex items-center gap-1.5 text-xs">
                        <span>⚡ 自动化测试套件与契约绑定</span>
                      </div>
                      <div className="text-[11px] text-slate-300 font-mono space-y-1.5 bg-slate-950/80 p-3 rounded border border-indigo-950">
                        <div>执行系统: <span className="text-indigo-400 font-bold">{selectedNode.externalBinding.system}</span></div>
                        <div>目标套件: <span className="text-amber-300 font-bold">{selectedNode.externalBinding.targetId}</span></div>
                        {selectedNode.externalBinding.meta?.endpoint && (
                          <div>探活接口: <span className="text-emerald-400">{selectedNode.externalBinding.meta.endpoint}</span></div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* 端体验与客观验收标准 DoD */}
                  <div>
                    <h3 className="font-semibold text-slate-200 mb-2 flex items-center gap-1.5 text-sm">
                      <span>📋 端体验与客观验收标准 (DoD)</span>
                    </h3>
                    <ul className="space-y-2">
                      {selectedNode.acceptanceCriteria?.map((ac, idx) => (
                        <li key={idx} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-slate-300 flex items-start gap-2.5 leading-relaxed text-xs">
                          <span className="text-emerald-400 font-bold mt-0.5">✓</span>
                          <span>{ac}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* 审查与反馈意见 */}
                  <div>
                    <h3 className="font-semibold text-slate-200 mb-2 flex items-center gap-1.5 text-sm">
                      <span>💬 真机体验走查反馈意见</span>
                    </h3>
                    <div className="space-y-2">
                      {selectedNode.review?.comments?.length > 0 ? (
                        selectedNode.review.comments.map((c, idx) => (
                          <div key={idx} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-300 font-mono leading-relaxed">
                            {c}
                          </div>
                        ))
                      ) : (
                        <div className="text-slate-500 italic p-3 bg-slate-950 rounded-xl">暂无走查反馈</div>
                      )}
                    </div>
                  </div>
                </div>

                {/* 底部操作区 */}
                <div className="p-5 border-t border-slate-800 bg-slate-950">
                  {selectedNode.status === "logic_verified" ? (
                    <div className="space-y-2.5">
                      <div className="text-[11px] text-sky-400 font-mono flex items-center gap-1">
                        <span>💡 客观逻辑已通，请体验设计师/PM 完成最终放电审批</span>
                      </div>
                      <button
                        onClick={() => handleHumanSignOff(selectedNode.nodeId)}
                        className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.4)] text-xs transition-all active:scale-95"
                      >
                        ✓ 确认真机体验合格·终审签字通电 (Sign-off)
                      </button>
                    </div>
                  ) : selectedNode.status === "review_pass" ? (
                    <div className="text-center py-2 text-xs text-emerald-400 font-mono bg-emerald-950/30 rounded-lg border border-emerald-900/50">
                      ● 节点已完全验收导通，向全链路正常输送能量
                    </div>
                  ) : selectedNode.status === "deving" ? (
                    <div className="text-center py-2 text-xs text-amber-400 font-mono bg-amber-950/30 rounded-lg border border-amber-900/50">
                      ◐ 体验设计与研发走查中...
                    </div>
                  ) : (
                    <div className="text-center py-2 text-xs text-slate-500 font-mono bg-slate-900 rounded-lg border border-slate-800">
                      ○ 依赖步骤尚未完成，等待激活
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>

          {/* 全局卡点责任归属追查面板 (Modal) */}
          {bottlenecksModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 animate-in fade-in duration-200">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">🚨</span>
                    <div>
                      <h2 className="font-bold text-base text-white">全链路阻塞卡点与责任人追踪</h2>
                      <p className="text-xs text-slate-400 mt-0.5">精准追踪到底卡在谁手里、卡住了下游哪些人、如何尽快疏通</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setBottlenecksModalOpen(false)}
                    className="text-slate-400 hover:text-white text-lg font-mono p-1 rounded hover:bg-slate-800"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 overflow-y-auto space-y-4 custom-scroll">
                  {bottlenecks.length === 0 ? (
                    <div className="text-center py-12 text-slate-500 font-mono">
                      🎉 当前项目链路 100% 畅通，无任何阻断卡点！
                    </div>
                  ) : (
                    bottlenecks.map((b, idx) => (
                      <div
                        key={idx}
                        className="bg-slate-950 border border-slate-800 rounded-xl p-4.5 hover:border-slate-700 transition-all space-y-3"
                      >
                        <div className="flex items-start justify-between">
                          <div className="flex items-center gap-2">
                            <span className="px-2 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-800 font-mono text-xs font-bold">
                              {b.blockerNodeId}
                            </span>
                            <h3 className="font-bold text-sm text-slate-100">{b.blockerNodeLabel}</h3>
                          </div>
                          <span className={`text-[11px] font-mono px-2 py-0.5 rounded font-bold ${
                            b.severity === "high" ? "bg-rose-900/60 text-rose-300 border border-rose-700" : "bg-amber-900/60 text-amber-300 border border-amber-700"
                          }`}>
                            {b.severity === "high" ? "严重阻塞" : "关注卡点"}
                          </span>
                        </div>

                        {/* 责任人与阻断受害者 */}
                        <div className="grid grid-cols-2 gap-3 text-xs bg-slate-900/60 p-3 rounded-lg border border-slate-800/80 font-mono">
                          <div>
                            <span className="text-slate-400">👤 当前卡在: </span>
                            <span className="font-bold text-rose-400">{b.blockerAssignee}</span>
                            <span className="text-slate-500 ml-1">({b.blockerRole})</span>
                          </div>
                          <div>
                            <span className="text-slate-400">⚠️ 正在阻断下游: </span>
                            <span className="font-bold text-amber-300">{b.blockedDownstreamCount} 个任务</span>
                          </div>
                          <div className="col-span-2 flex items-center gap-1.5 flex-wrap">
                            <span className="text-slate-400">⏳ 受阻人员: </span>
                            {b.blockedAssignees.length === 0 ? (
                              <span className="text-slate-500">无其他跨人依赖</span>
                            ) : (
                              b.blockedAssignees.map((a, i) => (
                                <span key={i} className="px-1.5 py-0.2 rounded bg-slate-800 text-sky-300 border border-slate-700 text-[11px]">
                                  {a}
                                </span>
                              ))
                            )}
                          </div>
                        </div>

                        <div className="flex items-center justify-between text-xs pt-1">
                          <span className="text-slate-400 text-[11px]">{b.reason}</span>
                          <button
                            onClick={() => handleLocateNode(b.blockerNodeId)}
                            className="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-emerald-400 hover:text-emerald-300 font-mono text-xs border border-slate-700 transition-all flex items-center gap-1"
                          >
                            <span>🎯</span>
                            <span>在画布中定位卡点</span>
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
