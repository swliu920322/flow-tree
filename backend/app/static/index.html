<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowTree 智能项目状态电路引擎 (v1.0 MVP)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel for JSX -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes electricFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .flow-wire {
      stroke-dasharray: 8, 6;
      animation: electricFlow 1.2s linear infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
      50% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.8); }
    }
    .bulb-breathing { animation: pulseGlow 2s infinite ease-in-out; }
    @keyframes alertFlash {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
    }
    .bulb-alert { animation: alertFlash 1.5s infinite ease-in-out; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen overflow-hidden selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // 8 大模块基础元数据定义
    const MODULE_METADATA = {
      "MOD-01": { id: "MOD-01", name: "模块一：鉴权与账号记忆", color: "#38bdf8" },
      "MOD-02": { id: "MOD-02", name: "模块二：伙伴关系契约网络", color: "#a855f7" },
      "MOD-03": { id: "MOD-03", name: "模块三：双代币隔离分账引擎", color: "#10b981" },
      "MOD-04": { id: "MOD-04", name: "模块四：自律任务与手风琴树卡", color: "#06b6d4" },
      "MOD-05": { id: "MOD-05", name: "模块五：他律指派与审批中心", color: "#f59e0b" },
      "MOD-06": { id: "MOD-06", name: "模块六：心愿兑现与伙伴商城", color: "#ec4899" },
      "MOD-07": { id: "MOD-07", name: "模块七：克制储蓄挑战罐", color: "#84cc16" },
      "MOD-08": { id: "MOD-08", name: "模块八：全域状态同构与审计流", color: "#6366f1" }
    };

    // ==========================================
    // 工业级交互画布：支持模块折叠展开、负责人透镜高亮与自由拖拽平移
    // ==========================================
    function InteractiveCircuitCanvas({
      nodes,
      edges,
      onNodeSelect,
      selectedNodeId,
      collapsedModules,
      onToggleModule,
      assigneeFilter,
      riskOnlyFilter
    }) {
      const containerRef = useRef(null);

      const [transform, setTransform] = useState({ x: 80, y: 60, scale: 0.85 });
      const transformRef = useRef(transform);
      transformRef.current = transform;

      const [isPanning, setIsPanning] = useState(false);
      const isPanningRef = useRef(false);
      const panStartRef = useRef({ x: 0, y: 0 });

      const [nodePositions, setNodePositions] = useState({});
      const nodePositionsRef = useRef(nodePositions);
      nodePositionsRef.current = nodePositions;

      const draggingNodeRef = useRef(null);

      // 计算模块聚合状态
      const moduleStats = useMemo(() => {
        const stats = {};
        Object.keys(MODULE_METADATA).forEach(mId => {
          stats[mId] = { total: 0, pass: 0, waiting: 0, deving: 0, blocked: 0, hours: 0 };
        });

        nodes.forEach(n => {
          const mId = n.raw?.parentId || "MOD-01";
          if (!stats[mId]) stats[mId] = { total: 0, pass: 0, waiting: 0, deving: 0, blocked: 0, hours: 0 };
          stats[mId].total += 1;
          stats[mId].hours += n.raw.estimateHours || 0;
          if (n.status === "review_pass") stats[mId].pass += 1;
          else if (n.status === "logic_verified") stats[mId].waiting += 1;
          else if (n.status === "deving") stats[mId].deving += 1;
          else if (n.status === "review_reject") stats[mId].blocked += 1;
        });
        return stats;
      }, [nodes]);

      // 过滤与可见节点计算 (折叠逻辑)
      const visibleNodes = useMemo(() => {
        return nodes.filter(n => {
          const mId = n.raw?.parentId;
          // 若父模块被折叠，则隐藏该子节点
          if (mId && collapsedModules[mId]) return false;
          // 卡点过滤器
          if (riskOnlyFilter) {
            if (n.status === "review_pass") return false;
          }
          return true;
        });
      }, [nodes, collapsedModules, riskOnlyFilter]);

      // 自动计算布局 (模块化左右分层)
      useEffect(() => {
        if (!nodes || nodes.length === 0) {
          setNodePositions({});
          return;
        }

        // 模块顺序
        const moduleOrder = ["MOD-01", "MOD-02", "MOD-03", "MOD-04", "MOD-05", "MOD-06", "MOD-07", "MOD-08"];
        const moduleNodesMap = {};
        moduleOrder.forEach(mId => { moduleNodesMap[mId] = []; });

        visibleNodes.forEach(n => {
          const mId = n.raw?.parentId || "MOD-01";
          if (!moduleNodesMap[mId]) moduleNodesMap[mId] = [];
          moduleNodesMap[mId].push(n);
        });

        const newPos = {};
        const colWidth = 340;
        const gapX = 160;
        let currentX = 80;

        moduleOrder.forEach((mId, mIdx) => {
          const isCollapsed = collapsedModules[mId];
          const subNodes = moduleNodesMap[mId] || [];

          // 模块胶囊坐标
          const modX = currentX;
          const modY = 40;
          newPos[mId] = { x: modX, y: modY, width: 340, height: isCollapsed ? 100 : 70 };

          if (!isCollapsed) {
            // 展开子用例
            subNodes.forEach((node, nIdx) => {
              newPos[node.id] = {
                x: modX,
                y: 140 + nIdx * 150,
                width: 320,
                height: 135
              };
            });
          }

          currentX += colWidth + gapX;
        });

        setNodePositions(newPos);
      }, [nodes, visibleNodes, collapsedModules]);

      // 全局事件监听 (防卡顿)
      useEffect(() => {
        const handleGlobalMouseMove = (e) => {
          if (isPanningRef.current) {
            setTransform(prev => ({
              ...prev,
              x: e.clientX - panStartRef.current.x,
              y: e.clientY - panStartRef.current.y
            }));
            return;
          }

          if (draggingNodeRef.current) {
            const { nodeId, startMouseX, startMouseY, startNodeX, startNodeY } = draggingNodeRef.current;
            const currentScale = transformRef.current.scale;
            const dx = (e.clientX - startMouseX) / currentScale;
            const dy = (e.clientY - startMouseY) / currentScale;
            setNodePositions(prev => ({
              ...prev,
              [nodeId]: {
                ...prev[nodeId],
                x: startNodeX + dx,
                y: startNodeY + dy
              }
            }));
          }
        };

        const handleGlobalMouseUp = () => {
          if (isPanningRef.current) {
            isPanningRef.current = false;
            setIsPanning(false);
          }
          if (draggingNodeRef.current) {
            draggingNodeRef.current = null;
          }
        };

        window.addEventListener('mousemove', handleGlobalMouseMove);
        window.addEventListener('mouseup', handleGlobalMouseUp);

        return () => {
          window.removeEventListener('mousemove', handleGlobalMouseMove);
          window.removeEventListener('mouseup', handleGlobalMouseUp);
        };
      }, []);

      const handleWheel = (e) => {
        e.preventDefault();
        const container = containerRef.current;
        if (!container) return;
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        setTransform(prev => {
          const nextScale = Math.min(Math.max(prev.scale * zoomFactor, 0.2), 3.0);
          const nextX = mouseX - (mouseX - prev.x) * (nextScale / prev.scale);
          const nextY = mouseY - (mouseY - prev.y) * (nextScale / prev.scale);
          return { x: nextX, y: nextY, scale: nextScale };
        });
      };

      const handleCanvasMouseDown = () => {
        isPanningRef.current = true;
        setIsPanning(true);
        panStartRef.current = {
          x: window.event.clientX - transformRef.current.x,
          y: window.event.clientY - transformRef.current.y
        };
      };

      const handleNodeMouseDown = (e, nodeId) => {
        e.stopPropagation();
        const currentPos = nodePositionsRef.current[nodeId] || { x: 0, y: 0 };
        draggingNodeRef.current = {
          nodeId,
          startMouseX: e.clientX,
          startMouseY: e.clientY,
          startNodeX: currentPos.x,
          startNodeY: currentPos.y
        };
      };

      const zoomIn = () => setTransform(prev => ({ ...prev, scale: Math.min(prev.scale * 1.2, 3.0) }));
      const zoomOut = () => setTransform(prev => ({ ...prev, scale: Math.max(prev.scale * 0.8, 0.2) }));
      const resetView = () => setTransform({ x: 80, y: 60, scale: 0.85 });

      return (
        <div
          ref={containerRef}
          onWheel={handleWheel}
          onMouseDown={handleCanvasMouseDown}
          className={`relative w-full h-full overflow-hidden select-none bg-slate-950 ${
            isPanning ? 'cursor-grabbing' : 'cursor-grab'
          }`}
          style={{
            backgroundImage: 'radial-gradient(circle, #334155 1.2px, transparent 1.2px)',
            backgroundSize: `${28 * transform.scale}px ${28 * transform.scale}px`,
            backgroundPosition: `${transform.x}px ${transform.y}px`
          }}
        >
          {/* 浮动控制工具条 */}
          <div className="absolute bottom-6 left-6 z-20 flex items-center gap-1.5 bg-slate-900/95 border border-slate-800 rounded-xl p-1.5 shadow-2xl backdrop-blur-md">
            <button
              onClick={zoomIn}
              className="w-8 h-8 rounded-lg hover:bg-slate-800 flex items-center justify-center text-slate-300 font-bold hover:text-white"
              title="放大"
            >
              +
            </button>
            <button
              onClick={zoomOut}
              className="w-8 h-8 rounded-lg hover:bg-slate-800 flex items-center justify-center text-slate-300 font-bold hover:text-white"
              title="缩小"
            >
              -
            </button>
            <button
              onClick={resetView}
              className="px-3 h-8 rounded-lg hover:bg-slate-800 flex items-center justify-center text-xs font-mono text-slate-300 hover:text-white font-medium"
              title="复位视角"
            >
              {Math.round(transform.scale * 100)}% 居中
            </button>
            <div className="text-[11px] text-slate-500 px-2 font-mono border-l border-slate-800">
              💡 鼠标拖动画布 / 滚轮自由缩放 / 拖拽节点卡片 / 点击模块右上角收放
            </div>
          </div>

          {/* 无限可变换主画布 */}
          <div
            style={{
              transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`,
              transformOrigin: '0 0',
              position: 'absolute',
              inset: 0,
              pointerEvents: 'none'
            }}
          >
            {/* SVG 导线层 */}
            <svg
              className="absolute pointer-events-none overflow-visible"
              style={{ width: '1px', height: '1px', left: 0, top: 0 }}
            >
              <defs>
                <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="3.5" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="4.5" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              {edges.map(e => {
                // 如果端点节点被隐藏折叠，尝试连接到父模块胶囊
                let sourcePos = nodePositions[e.source];
                let targetPos = nodePositions[e.target];

                const sNode = nodes.find(n => n.id === e.source);
                const tNode = nodes.find(n => n.id === e.target);

                if (!sourcePos && sNode?.raw?.parentId) {
                  sourcePos = nodePositions[sNode.raw.parentId];
                }
                if (!targetPos && tNode?.raw?.parentId) {
                  targetPos = nodePositions[tNode.raw.parentId];
                }

                if (!sourcePos || !targetPos) return null;

                const startX = sourcePos.x + (sourcePos.width || 320);
                const startY = sourcePos.y + (sourcePos.height || 135) / 2;
                const endX = targetPos.x;
                const endY = targetPos.y + (targetPos.height || 135) / 2;
                const deltaX = Math.max(50, Math.abs(endX - startX) / 2);

                const d = `M ${startX} ${startY} C ${startX + deltaX} ${startY}, ${endX - deltaX} ${endY}, ${endX} ${endY}`;
                const isEnergized = e.circuitState === "energized";
                const isBlocked = e.circuitState === "blocked";

                // 透镜半透明判定
                let edgeOpacity = 1.0;
                if (assigneeFilter !== "all") {
                  const sMatch = sNode?.raw?.assignee?.includes(assigneeFilter);
                  const tMatch = tNode?.raw?.assignee?.includes(assigneeFilter);
                  if (!sMatch && !tMatch) edgeOpacity = 0.15;
                }

                return (
                  <g key={e.id} style={{ opacity: edgeOpacity }} className="transition-opacity duration-200">
                    <path
                      d={d}
                      fill="none"
                      stroke={isBlocked ? "#7f1d1d" : isEnergized ? "#064e3b" : "#334155"}
                      strokeWidth={isEnergized ? "4" : "2"}
                      strokeDasharray={e.isBypass ? "5,5" : "none"}
                    />
                    {e.flowAnimation && (
                      <path
                        d={d}
                        fill="none"
                        stroke="#10B981"
                        strokeWidth="3.5"
                        className="flow-wire"
                        filter="url(#glowGreen)"
                      />
                    )}
                    {isBlocked && (
                      <path
                        d={d}
                        fill="none"
                        stroke="#EF4444"
                        strokeWidth="3"
                        strokeDasharray="6,4"
                        filter="url(#glowRed)"
                      />
                    )}
                  </g>
                );
              })}
            </svg>

            {/* 模块根节点胶囊 (Module Roots) */}
            {Object.keys(MODULE_METADATA).map(mId => {
              const pos = nodePositions[mId];
              if (!pos) return null;
              const meta = MODULE_METADATA[mId];
              const stat = moduleStats[mId] || { total: 0, pass: 0, waiting: 0, deving: 0, blocked: 0, hours: 0 };
              const isCollapsed = collapsedModules[mId];
              const passRate = stat.total > 0 ? Math.round((stat.pass / stat.total) * 100) : 0;

              return (
                <div
                  key={mId}
                  onMouseDown={(e) => handleNodeMouseDown(e, mId)}
                  style={{
                    position: "absolute",
                    left: `${pos.x}px`,
                    top: `${pos.y}px`,
                    width: `${pos.width}px`,
                    height: `${pos.height}px`,
                    pointerEvents: 'auto'
                  }}
                  className={`rounded-xl border-2 p-3 transition-all duration-200 backdrop-blur-xl shadow-2xl flex flex-col justify-between cursor-move bg-slate-900/90 ${
                    isCollapsed ? "border-slate-700 hover:border-slate-500" : "border-indigo-500/50 bg-indigo-950/20"
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 overflow-hidden">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: meta.color }} />
                      <span className="font-bold text-xs truncate text-slate-100">{meta.name}</span>
                    </div>
                    {/* 折叠/展开切换按钮 */}
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        onToggleModule(mId);
                      }}
                      className="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xs font-mono font-bold text-slate-300 hover:text-white shrink-0"
                      title={isCollapsed ? "展开该模块细分用例" : "折叠收纳该模块"}
                    >
                      {isCollapsed ? "+" : "−"}
                    </button>
                  </div>

                  {/* 模块进度与统计 */}
                  <div className="flex items-center justify-between text-[11px] font-mono pt-1 text-slate-400">
                    <div className="flex items-center gap-2">
                      <span className="text-emerald-400 font-bold">{stat.pass}/{stat.total} 通过</span>
                      {stat.waiting > 0 && <span className="text-sky-400">{stat.waiting} 待审</span>}
                      {stat.deving > 0 && <span className="text-amber-400">{stat.deving} 施工</span>}
                    </div>
                    <span className="text-slate-500">{passRate}% · {stat.hours}h</span>
                  </div>
                </div>
              );
            })}

            {/* 细分 UML 用例卡片 (Use Case Nodes) */}
            {visibleNodes.map(node => {
              const pos = nodePositions[node.id];
              if (!pos) return null;

              const isSelected = selectedNodeId === node.id;
              const bulb = node.bulbState;

              // 负责人透镜判定 (Focus & Context)
              let nodeOpacity = 1.0;
              let isFocus = true;
              if (assigneeFilter !== "all") {
                const match = node.raw?.assignee?.includes(assigneeFilter);
                if (!match) {
                  nodeOpacity = 0.25;
                  isFocus = false;
                }
              }

              let bulbBg = "bg-slate-700 text-slate-400";
              let cardBorder = "border-slate-800 bg-slate-900/90";
              let bulbGlowClass = "";
              let statusLabel = "待开工";

              if (bulb === "green_on") {
                bulbBg = "bg-emerald-500 text-white shadow-[0_0_15px_#10b981]";
                cardBorder = "border-emerald-500/60 bg-emerald-950/30";
                statusLabel = "已导通·通过";
              } else if (bulb === "blue_waiting") {
                bulbBg = "bg-sky-500 text-white shadow-[0_0_15px_#0ea5e9]";
                cardBorder = "border-sky-500/60 bg-sky-950/30";
                statusLabel = "待终审 (逻辑已过)";
              } else if (bulb === "breathing") {
                bulbBg = "bg-amber-500 text-white";
                cardBorder = "border-amber-500/60 bg-amber-950/30";
                bulbGlowClass = "bulb-breathing";
                statusLabel = "通电施工中";
              } else if (bulb === "red_alert") {
                bulbBg = "bg-rose-600 text-white";
                cardBorder = "border-rose-600/80 bg-rose-950/40";
                bulbGlowClass = "bulb-alert";
                statusLabel = "短路熔断报警";
              }

              return (
                <div
                  key={node.id}
                  onMouseDown={(e) => handleNodeMouseDown(e, node.id)}
                  onClick={(e) => {
                    e.stopPropagation();
                    onNodeSelect(node.raw);
                  }}
                  style={{
                    position: "absolute",
                    left: `${pos.x}px`,
                    top: `${pos.y}px`,
                    width: `${pos.width}px`,
                    height: `${pos.height}px`,
                    opacity: nodeOpacity,
                    pointerEvents: 'auto'
                  }}
                  className={`group cursor-move rounded-xl border-2 p-3 transition-all duration-200 backdrop-blur-md shadow-2xl flex flex-col justify-between ${cardBorder} ${
                    isSelected ? "ring-2 ring-emerald-400 scale-[1.02] z-10" : isFocus ? "hover:border-slate-500 hover:scale-[1.01]" : ""
                  }`}
                >
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex items-center gap-2 overflow-hidden">
                      <div className={`w-3.5 h-3.5 rounded-full shrink-0 ${bulbBg} ${bulbGlowClass}`} />
                      <span className="font-semibold text-xs truncate text-slate-100 group-hover:text-emerald-300">
                        {node.label}
                      </span>
                    </div>
                    <span className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 shrink-0">
                      {node.id}
                    </span>
                  </div>

                  <div className="text-[11px] font-mono text-slate-400 flex items-center justify-between">
                    <span>{statusLabel}</span>
                    <span className="text-slate-500">{node.dataOverlay.hours}</span>
                  </div>

                  <div className="flex items-center justify-between text-[11px] pt-1.5 border-t border-slate-800/80">
                    <div className="flex items-center gap-1 text-slate-400">
                      <span className="w-4 h-4 rounded-full bg-slate-800 flex items-center justify-center text-[9px] text-slate-300 font-bold">
                        {node.dataOverlay.assignee ? node.dataOverlay.assignee[0] : "?"}
                      </span>
                      <span className="truncate max-w-[110px] text-[10px]">{node.dataOverlay.assignee || "未分配"}</span>
                    </div>

                    <div className="flex items-center gap-1">
                      {node.dataOverlay.hasExternalBinding && (
                        <span className="px-1 py-0.2 rounded text-[9px] bg-indigo-950/90 text-indigo-300 border border-indigo-700/60 font-mono">
                          ⚡ 契约
                        </span>
                      )}
                      {node.dataOverlay.isLogicVerified && (
                        <span className="text-sky-400 text-xs font-bold" title="客观断言已通过">✓</span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 平台层主应用 App
    // ==========================================
    function App() {
      const [projectList, setProjectList] = useState([]);
      const [currentProjectId, setCurrentProjectId] = useState("proj-life-piggy-bank");
      const [projectMeta, setProjectMeta] = useState(null);
      const [canvasData, setCanvasData] = useState(null);
      const [activeViewId, setActiveViewId] = useState("view-all");
      const [selectedNode, setSelectedNode] = useState(null);
      const [loading, setLoading] = useState(true);
      const [isSimulating, setIsSimulating] = useState(false);

      // 新增过滤器状态
      const [assigneeFilter, setAssigneeFilter] = useState("all");
      const [riskOnlyFilter, setRiskOnlyFilter] = useState(false);

      // 模块折叠状态字典 (默认全部展开，支持一键全部收起)
      const [collapsedModules, setCollapsedModules] = useState({});

      useEffect(() => {
        fetch("/api/projects")
          .then(res => res.json())
          .then(data => setProjectList(data))
          .catch(err => console.error("加载项目列表失败:", err));
      }, []);

      const fetchProjectData = async (projId, viewId) => {
        try {
          const [metaRes, canvasRes] = await Promise.all([
            fetch(`/api/projects/${projId}`),
            fetch(`/api/projects/${projId}/canvas?view_id=${viewId}`)
          ]);
          const meta = await metaRes.json();
          const canvas = await canvasRes.json();
          setProjectMeta(meta);
          setCanvasData(canvas);
          if (selectedNode) {
            const updated = canvas.nodes.find(n => n.id === selectedNode.nodeId);
            if (updated) setSelectedNode(updated.raw);
          }
        } catch (err) {
          console.error("加载数据失败:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchProjectData(currentProjectId, activeViewId);
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/circuit`);
        ws.onmessage = () => {
          fetchProjectData(currentProjectId, activeViewId);
        };
        return () => ws.close();
      }, [currentProjectId, activeViewId]);

      const handleProjectChange = (e) => {
        const nextId = e.target.value;
        setCurrentProjectId(nextId);
        setActiveViewId("view-all");
        setSelectedNode(null);
        setLoading(true);
        fetchProjectData(nextId, "view-all");
      };

      const handleViewChange = (vId) => {
        setActiveViewId(vId);
        fetchProjectData(currentProjectId, vId);
      };

      // 单个模块切换折叠
      const handleToggleModule = (modId) => {
        setCollapsedModules(prev => ({
          ...prev,
          [modId]: !prev[modId]
        }));
      };

      // 一键全部展开
      const handleExpandAll = () => {
        setCollapsedModules({});
      };

      // 一键全部折叠 (仅看8大模块胶囊)
      const handleCollapseAll = () => {
        const allCollapsed = {};
        Object.keys(MODULE_METADATA).forEach(mId => { allCollapsed[mId] = true; });
        setCollapsedModules(allCollapsed);
      };

      const handleSimulateAgent = async () => {
        setIsSimulating(true);
        try {
          await fetch(`/api/projects/${currentProjectId}/simulate-agent`, { method: "POST" });
          await fetchProjectData(currentProjectId, activeViewId);
        } finally {
          setIsSimulating(false);
        }
      };

      const handleHumanSignOff = async (nodeId) => {
        await fetch(`/api/projects/${currentProjectId}/nodes/${nodeId}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            status: "review_pass",
            reviewComments: ["【人类终审】交互体验验收合格，确认签字并放电！"],
            source: "human_reviewer"
          })
        });
        await fetchProjectData(currentProjectId, activeViewId);
      };

      if (loading) {
        return (
          <div className="h-screen flex items-center justify-center bg-slate-950 text-emerald-400 font-mono text-lg">
            ⚡ 正在初始化 FlowTree 模块电路架构...
          </div>
        );
      }

      const stats = canvasData?.stats || { totalNodes: 0, energizedNodes: 0, blockedNodes: 0, progressRate: 0 };

      return (
        <div className="flex flex-col h-screen bg-slate-950">
          {/* 顶栏 Header */}
          <header className="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/90 backdrop-blur-md shrink-0 z-20">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-[0_0_12px_rgba(16,185,129,0.3)]">
                ⚡
              </div>
              <div className="flex items-center gap-2">
                <select
                  value={currentProjectId}
                  onChange={handleProjectChange}
                  className="bg-slate-800/90 border border-slate-700 text-white font-bold text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
                >
                  {projectList.map(p => (
                    <option key={p.projectId} value={p.projectId}>
                      {p.projectName} ({p.nodeCount}用例)
                    </option>
                  ))}
                </select>
                <span className="text-[11px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-mono">
                  {projectMeta?.version}
                </span>
              </div>
            </div>

            {/* 状态统计 */}
            <div className="flex items-center gap-6 text-xs font-mono">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]" />
                <span className="text-slate-400">已导通:</span>
                <span className="text-emerald-400 font-bold">{stats.energizedNodes}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]" />
                <span className="text-slate-400">待终审:</span>
                <span className="text-sky-400 font-bold">{stats.logicVerifiedNodes}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_#ef4444]" />
                <span className="text-slate-400">故障熔断:</span>
                <span className="text-rose-400 font-bold">{stats.blockedNodes}</span>
              </div>
              <div className="flex items-center gap-2 border-l border-slate-800 pl-4">
                <span className="text-slate-400">全链导通进度:</span>
                <span className="text-emerald-400 font-bold">{Math.round(stats.progressRate * 100)}%</span>
              </div>
            </div>

            {/* 操作按钮 */}
            <div className="flex items-center gap-2">
              <button
                onClick={handleSimulateAgent}
                disabled={isSimulating}
                className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs flex items-center gap-1.5 shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all active:scale-95"
              >
                <span>⚡</span>
                <span>{isSimulating ? "Agent 追踪中..." : "触发 Agent 状态联动"}</span>
              </button>
            </div>
          </header>

          {/* 第二栏：动态视角 + 模块展开收起 + 负责人透镜与风险筛选 */}
          <div className="h-12 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/60 shrink-0 z-20">
            {/* 左侧：视角透镜 */}
            <div className="flex items-center gap-1.5 overflow-x-auto custom-scroll">
              <span className="text-xs text-slate-500 mr-1 font-mono shrink-0">业务视角:</span>
              {projectMeta?.perspectives.map((p) => {
                const isActive = activeViewId === p.viewId;
                return (
                  <button
                    key={p.viewId}
                    onClick={() => handleViewChange(p.viewId)}
                    className={`px-2.5 py-1 rounded-md text-xs font-medium transition-all flex items-center gap-1 shrink-0 ${
                      isActive
                        ? "bg-slate-800 text-emerald-400 border border-emerald-500/40 shadow-sm"
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"
                    }`}
                  >
                    <span>{p.name}</span>
                  </button>
                );
              })}
            </div>

            {/* 右侧交互控件：模块收放 + 负责人透镜 + 风险过滤 */}
            <div className="flex items-center gap-3 shrink-0">
              {/* 模块折叠展开控制 */}
              <div className="flex items-center bg-slate-800/80 rounded-lg p-0.5 border border-slate-700 text-xs">
                <button
                  onClick={handleExpandAll}
                  className="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 hover:text-white transition-colors"
                  title="展开所有模块与细分用例"
                >
                  ＋ 全部展开
                </button>
                <button
                  onClick={handleCollapseAll}
                  className="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 hover:text-white transition-colors border-l border-slate-700"
                  title="收起所有用例，仅看8大模块胶囊"
                >
                  − 全部折叠
                </button>
              </div>

              {/* 负责人透镜选择 */}
              <div className="flex items-center gap-1 text-xs">
                <span className="text-slate-500 font-mono">负责人:</span>
                <select
                  value={assigneeFilter}
                  onChange={(e) => setAssigneeFilter(e.target.value)}
                  className="bg-slate-800 border border-slate-700 text-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer"
                >
                  <option value="all">全部人员 (透镜关闭)</option>
                  <option value="Alice">Alice (前端 Flutter)</option>
                  <option value="Bob">Bob (后端 FastAPI)</option>
                  <option value="Carol">Carol (QA 质量架构)</option>
                </select>
              </div>

              {/* 只看卡点复选框 */}
              <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer select-none hover:text-white">
                <input
                  type="checkbox"
                  checked={riskOnlyFilter}
                  onChange={(e) => setRiskOnlyFilter(e.target.checked)}
                  className="rounded bg-slate-800 border-slate-700 text-emerald-500 focus:ring-0 cursor-pointer"
                />
                <span className="font-mono text-amber-400">只看卡点与待审</span>
              </label>
            </div>
          </div>

          {/* 主工作区 */}
          <div className="flex-1 relative overflow-hidden flex z-10">
            <div className="flex-1 h-full">
              <InteractiveCircuitCanvas
                nodes={canvasData?.nodes || []}
                edges={canvasData?.edges || []}
                selectedNodeId={selectedNode?.nodeId}
                onNodeSelect={(raw) => setSelectedNode(raw)}
                collapsedModules={collapsedModules}
                onToggleModule={handleToggleModule}
                assigneeFilter={assigneeFilter}
                riskOnlyFilter={riskOnlyFilter}
              />
            </div>

            {/* 右侧节点详情抽屉 */}
            {selectedNode && (
              <div className="w-[440px] border-l border-slate-800 bg-slate-900/95 backdrop-blur-xl h-full flex flex-col shadow-2xl z-30">
                <div className="p-4 border-b border-slate-800 flex items-start justify-between">
                  <div>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-emerald-400 uppercase font-bold">
                      {selectedNode.nodeId} · {selectedNode.nodeType}
                    </span>
                    <h2 className="font-bold text-base text-white mt-1.5 leading-snug">{selectedNode.name}</h2>
                    <p className="text-xs text-slate-400 mt-1">{selectedNode.description || "无详细描述"}</p>
                  </div>
                  <button
                    onClick={() => setSelectedNode(null)}
                    className="text-slate-400 hover:text-white text-lg font-mono p-1"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4 text-xs custom-scroll">
                  <div className="bg-slate-950/60 p-3 rounded-lg border border-slate-800 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-slate-400">当前流转状态:</span>
                      <span className="font-mono font-bold text-emerald-400 px-2 py-0.5 rounded bg-emerald-950 border border-emerald-800">
                        {selectedNode.status}
                      </span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">负责人角色:</span>
                      <span className="text-slate-200 font-medium">{selectedNode.assignee || "未指定"} ({selectedNode.assignRole || "-"})</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">工时消耗:</span>
                      <span className="text-slate-200 font-mono">{selectedNode.actualHours}h / {selectedNode.estimateHours}h</span>
                    </div>
                    {selectedNode.tags && (
                      <div className="pt-2 border-t border-slate-800/80 flex flex-wrap gap-1">
                        {selectedNode.tags.map(t => (
                          <span key={t} className="px-1.5 py-0.5 rounded bg-slate-800 text-[10px] text-slate-300 font-mono">
                            #{t}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  {selectedNode.externalBinding && (
                    <div className="bg-indigo-950/30 p-3.5 rounded-lg border border-indigo-900/50 space-y-1.5">
                      <div className="font-semibold text-indigo-300 flex items-center gap-1.5 text-xs">
                        <span>⚡ 自动化测试套件与契约绑定</span>
                      </div>
                      <div className="text-[11px] text-slate-300 font-mono space-y-1 bg-slate-950/60 p-2.5 rounded border border-indigo-950">
                        <div>执行系统: <span className="text-indigo-400 font-bold">{selectedNode.externalBinding.system}</span></div>
                        <div>目标套件: <span className="text-amber-300 font-bold">{selectedNode.externalBinding.targetId}</span></div>
                        {selectedNode.externalBinding.meta?.endpoint && (
                          <div>探活接口: <span className="text-emerald-400">{selectedNode.externalBinding.meta.endpoint}</span></div>
                        )}
                      </div>
                    </div>
                  )}

                  <div>
                    <h3 className="font-semibold text-slate-300 mb-2">📋 客观逻辑验收标准 (DoD)</h3>
                    <ul className="space-y-1.5">
                      {selectedNode.acceptanceCriteria?.map((ac, idx) => (
                        <li key={idx} className="bg-slate-950 p-2.5 rounded border border-slate-800 text-slate-300 flex items-start gap-2 leading-relaxed">
                          <span className="text-emerald-500 font-bold mt-0.5">✓</span>
                          <span>{ac}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div>
                    <h3 className="font-semibold text-slate-300 mb-2">💬 自动化与人工审查报告</h3>
                    <div className="space-y-1.5">
                      {selectedNode.review?.comments?.length > 0 ? (
                        selectedNode.review.comments.map((c, idx) => (
                          <div key={idx} className="bg-slate-950/80 p-2.5 rounded border border-slate-800 text-[11px] text-slate-300 font-mono leading-relaxed">
                            {c}
                          </div>
                        ))
                      ) : (
                        <div className="text-slate-500 italic">暂无审查反馈</div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-800 bg-slate-950/90">
                  {selectedNode.status === "logic_verified" ? (
                    <div className="space-y-2">
                      <div className="text-[11px] text-sky-400 font-mono flex items-center gap-1">
                        <span>💡 自动化切片已跑通，等待 PM/架构师 终审签字</span>
                      </div>
                      <button
                        onClick={() => handleHumanSignOff(selectedNode.nodeId)}
                        className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg shadow-[0_0_15px_rgba(16,185,129,0.4)] text-xs transition-all active:scale-95"
                      >
                        ✓ 人工终审通过 (Sign-off) 并放电
                      </button>
                    </div>
                  ) : selectedNode.status === "review_pass" ? (
                    <div className="text-center py-1 text-xs text-emerald-400 font-mono">
                      ● 节点已完全验收导通，向全链路正常输送能量
                    </div>
                  ) : selectedNode.status === "deving" ? (
                    <div className="text-center py-1 text-xs text-amber-400 font-mono">
                      ◐ 依赖能量已注入，全栈研发施工中...
                    </div>
                  ) : (
                    <div className="text-center py-1 text-xs text-slate-500 font-mono">
                      ○ 依赖链路施工中，等待激活
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
